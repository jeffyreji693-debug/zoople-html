<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let balance = 1000;
      let choice;

      do {
        choice = Number(
          prompt(
            "ATM Menu \n" +
              "1. Check Balance \n" +
              "2. Deposite \n" +
              "3. Withdraw \n" +
              "4. Exit",
          ),
        );
        switch (choice) {
          case 1:
            console.log("Current Balance: ₹" + balance);
            break;

          case 2:
            let deposit = Number(prompt("Enter deposit amount:"));
            balance += deposit; //balance=balance+deposit
            console.log("₹" + deposit + "deposited.");
            console.log("New Balance: ₹" + balance);
            break;

          case 3:
            let withdraw = Number(prompt("Enter withdrawal amount:"));

            if (withdraw <= balance) {
              balance -= withdraw;
              console.log("₹" + withdraw + "withdrawal.");
              console.log("Remaining Balance: ₹" + balance);
            } else {
              console.log("Insufficent Balance!");
            }
            break;

          case 4:
            console.log("Thankyou for using the Atm.");
            break;

          default:
            console.log("Invalid choice!");
        }
      } while (choice != 4);
    </script>
  </body>
</html>
