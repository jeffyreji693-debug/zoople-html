<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swiggy</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <style>
      body {
        background-color: orangered;
        color: white;
      }
      nav {
        display: flex;
        justify-content: space-between;
      }
      ul {
        list-style-type: none;
        display: flex;
        gap: 20px;
      }
      .btn1 {
        border-radius: 10px;
        width: 150px;
        height: 50px;
        background-color: orangered;
        color: white;
        border: 1px solid white;
      }

      .btn2 {
        border-radius: 10px;
        width: 150px;
        height: 50px;
        background-color: rgb(0, 0, 0);
        color: white;
        border: none;
      }
      .body {
        display: flex;
        justify-content: space-between;
      }
      input{
        border-radius: 5px;
      }

    </style>
  </head>
  <body>
    <div>
      <header>
        <nav>
          <img
            src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto/portal/static-assets/images/swiggy_logo_white.png"
            alt=""
            width="150"
          />
          <ul>
            <li>Swiggy Corporate</li>
            <li>Partner with us</li>
            <button class="btn1">
              Get the app <i class="fa-solid fa-arrow-trend-up"></i>
            </button>
            <button class="btn2">Sign in</button>
          </ul>
        </nav>

        <div class="body">
          <img
            src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto/portal/testing/seo-home/Veggies_new.png"
            alt=""
            width="300px"
          />
          <div>
            <h1>
              Order food & groceries. Discover best restaurant. Swiggy it!
            </h1>
            <i class="fa-solid fa-location-dot"></i>
            <input style="width: 250px; height: 50px; border: 1px solid none;" type="text" placeholder="Enter your delivery location" >

            <i class="fa-solid fa-chevron-down"></i>
            <input style="width: 300px; height: 50px; border: 1px solid none;" type="text" placeholder="Search for restaurant, item or more"> <br>

            <img src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto/MERCHANDISING_BANNERS/IMAGES/MERCH/2024/7/23/ec86a309-9b06-48e2-9adc-35753f06bc0a_Food3BU.png" alt="" width="250px">
            <img src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto/MERCHANDISING_BANNERS/IMAGES/MERCH/2024/7/23/b5c57bbf-df54-4dad-95d1-62e3a7a8424d_IM3BU.png" alt="" width="250px">
            <img src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto/MERCHANDISING_BANNERS/IMAGES/MERCH/2024/7/23/b6d9b7ab-91c7-4f72-9bf2-fcd4ceec3537_DO3BU.png" alt="" width="250px">
          </div>

          <img
            src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto/portal/testing/seo-home/Sushi_replace.png"
            alt=""
            width="300px"
          />
        </div>
      </header>
    </div>
  </body>
</html>
