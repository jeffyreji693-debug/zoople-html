<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background-color: #ffffff;
            font-size: 14px;
        }

        .navbar {
            background-color: #0d6efd;
            padding: 8px 15px;
        }

        .navbar-brand {
            color: white;
            font-size: 16px;
        }

        .top-links a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
            font-size: 12px;
        }

        .sidebar {
            background-color: #212529;
            color: white;
            min-height: calc(100vh - 40px);
            padding: 12px 0;
        }

        .sidebar h5 {
            font-size: 14px;
            margin-bottom: 20px;
        }

        .sidebar a {
            display: block;
            padding: 9px 5px;
            color: white;
            text-decoration: none;
            font-size: 12px;
        }

        .sidebar a:hover {
            background-color: #343a40;
        }

        .main-content {
            padding: 15px;
        }

        .page-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .summary-card {
            border: 1px solid #e5e5e5;
            border-radius: 6px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.12);
            padding: 12px;
            text-align: center;
            height: 90px;
        }

        .summary-card h6 {
            font-size: 12px;
            margin-bottom: 5px;
        }

        .summary-card h3 {
            font-size: 20px;
            margin: 0;
        }

        .search-box {
            margin-top: 12px;
            margin-bottom: 12px;
        }

        .search-box input {
            font-size: 12px;
        }

        .table {
            font-size: 12px;
        }

        .table thead th {
            background-color: #212529;
            color: white;
            font-weight: 600;
            padding: 7px 5px;
        }

        .table tbody td {
            padding: 5px;
            vertical-align: middle;
        }

        .btn-sm {
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 3px;
        }

        @media (max-width: 767px) {
            .sidebar {
                min-height: auto;
            }

            .main-content {
                padding: 12px;
            }

            .top-links a {
                margin-left: 7px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand">
        <a class="navbar-brand" href="#">Student Dashboard</a>

        <div class="top-links ms-auto">
            <a href="#">Home</a>
            <a href="#">Students</a>
            <a href="#">Courses</a>
            <a href="#">Logout</a>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">

            <!-- Sidebar -->
            <div class="col-2 col-md-2 sidebar ">
                <h5>Menu</h5>

                <a href="#">Dashboard</a>
                <a href="#">Students</a>
                <a href="#">Courses</a>
                <a href="#">Attendance</a>
                <a href="#">Reports</a>
            </div>

            <!-- Main Content -->
            <div class="col-10 col-md-10 main-content">

                <h2 class="page-title">Student Management</h2>

                <!-- Summary Cards -->
                <div class="row g-3">

                    <div class="col-md-4 col-12">
                        <div class="summary-card">
                            <h6>Total Students</h6>
                            <h3>500</h3>
                        </div>
                    </div>

                    <div class="col-md-4 col-12">
                        <div class="summary-card">
                            <h6>Courses</h6>
                            <h3>25</h3>
                        </div>
                    </div>

                    <div class="col-md-4 col-12">
                        <div class="summary-card">
                            <h6>Attendance</h6>
                            <h3>95%</h3>
                        </div>
                    </div>

                </div>

                <!-- Search -->
                <div class="search-box">
                    <input type="text" id="searchStudent"
                        class="form-control"
                        placeholder="Search Student"
                        onkeyup="searchStudents()">
                </div>

                <!-- Student Table -->
                <div class="table-responsive">
                    <table class="table table-bordered">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Course</th>
                                <th>Email</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody id="studentTable">

                            <tr>
                                <td>101</td>
                                <td>AA</td>
                                <td>MEEN Stack</td>
                                <td>aa@gmail.com</td>
                                <td>
                                    <button class="btn btn-warning btn-sm"
                                        onclick="editStudent(this)">Edit</button>
                                    <button class="btn btn-danger btn-sm"
                                        onclick="deleteStudent(this)">Delete</button>
                                </td>
                            </tr>

                            <tr>
                                <td>102</td>
                                <td>BB</td>
                                <td>Python</td>
                                <td>bb@gmail.com</td>
                                <td>
                                    <button class="btn btn-warning btn-sm"
                                        onclick="editStudent(this)">Edit</button>
                                    <button class="btn btn-danger btn-sm"
                                        onclick="deleteStudent(this)">Delete</button>
                                </td>
                            </tr>

                            <tr>
                                <td>103</td>
                                <td>CC</td>
                                <td>Java</td>
                                <td>cc@gmail.com</td>
                                <td>
                                    <button class="btn btn-warning btn-sm"
                                        onclick="editStudent(this)">Edit</button>
                                    <button class="btn btn-danger btn-sm"
                                        onclick="deleteStudent(this)">Delete</button>
                                </td>
                            </tr>

                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <script>
        function searchStudents() {
            let input = document.getElementById("searchStudent").value.toLowerCase();
            let rows = document.querySelectorAll("#studentTable tr");

            rows.forEach(function(row) {
                let text = row.innerText.toLowerCase();
                row.style.display = text.includes(input) ? "" : "none";
            });
        }

        function deleteStudent(button) {
            if (confirm("Are you sure you want to delete this student?")) {
                button.closest("tr").remove();
            }
        }

        function editStudent(button) {
            let row = button.closest("tr");
            let cells = row.querySelectorAll("td");

            let name = prompt("Enter student name:", cells[1].innerText);
            if (name === null) return;

            let course = prompt("Enter course:", cells[2].innerText);
            if (course === null) return;

            let email = prompt("Enter email:", cells[3].innerText);
            if (email === null) return;

            cells[1].innerText = name;
            cells[2].innerText = course;
            cells[3].innerText = email;
        }
    </script>

</body>
</html>
