<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      /* class selectors */
      .fir {
        color: rgb(255, 163, 50);
      }
      .sec {
        color: brown;
      }
      #hi {
        color: blue;
      }

      /* Grouping selector */
      h6,p{
        color: blueviolet;
      }

      /* universal selector */

    *{
        color: blue;
    }


    </style>
  </head>
  <body>
    <h3 class="fir">Helloo</h3>
    <h3 class="sec">haii</h3>
    <h5>heyyyyy</h5>

    <!-- id selector -->
    <h2 id="hi">Hi, hellooooo</h2>

    <h6>welcome</h6>
    <p>xjncjenc</p>

    <h2>hcvwhc</h2>
  </body>
</html>
