<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        h2{
            text-align: center;
        }
        body{
            background:azure;
        }
        .container{
            display: flex;
            gap: 50px;
            justify-content: center;
            height: 5%;
            align-items:center ;
        }
        .card{
            box-shadow: 0px 5px 15px;
            width: 200px;
            height: 250px;
            padding: 20px;
            text-align: center;
            border-radius: 5px;
        }
        button{
            background: #00067a;
            color: white;
            width: 100px;
            height: 30px;
        }
    </style>
</head>
<body>
    <h2>Our Products</h2>
    <div class="container">
        <div class="card">
            <img src="shoe1.png" alt="" width="100px">
            <h4>Running Shoes</h4>
            <p><b>₹1,499</b></p>
            <button>Buy now</button>
        </div>
        <div class="card">
            <img src="shoe2.png" alt="" width="100px">
            <h4>Smart Watch</h4>
            <p><b>₹2,499</b></p>
            <button>Buy now</button>
        </div>
        <div class="card">
            <img src="shoe3.png" alt="" width="100px">
            <h4>Headphones</h4>
            <p><b>₹999</b></p>
            <button>Buy now</button>
        </div>
        
    </div>
</body>
</html>
