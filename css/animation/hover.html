<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        .container{
            display: flex;
            gap: 20px;
            height: 400px;
            align-items: center;
            justify-content: center;
        }

        .box{
            width: 100px;
            height: 100px;
            border-radius: 10px;
            transition: 1s ease;
        }

        .box1{
            background: #a30000;
        }
        .box1:hover{
            transform: translateX(100px);
        }

        .box2{
            background: #1e8a00;
        }
        .box2:hover{
            transform: scale(1.4);
        }

        .box3{
            background: #00787f;
        }
        .box3:hover{
            transform: rotate(240deg);
        }

        .box4{
            background: #000873;
        }
        .box4:hover{
            background-color: #3a0058;
        }

        .box5{
            background: #680044;
        }
        .box5:hover{
            transform: translatey(-40px);
        }
    </style>
</head>
<body>
    
    <h2>Hover Animation</h2>
    <div class="container">
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>
    <div class="box box5"></div>
</div>
</body>
</html>
