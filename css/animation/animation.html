<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .move{
            animation: moveing 5s ease-in 4;
            margin-top: 60%;
            position: relative;
        }

        @keyframes moveing{
         
            0%{
                transform: translatex(0%);
            }
            100%{
                transform: translatex(100%);
            }
        }

        .road{
            width: 100%;
            height: 100px;
            position: relative;
            background: linear-gradient(black, rgb(166,164,164));
        }

        img{
            position: absolute;
            width: 300px;
            height: 250px;
            margin-top: -13%;
        }
    </style>
</head>
<body>
    
    <div class="move">
       <img src="f1-removebg-preview.png" alt="">
    </div>

    <div class="road"></div>
</body>
</html>
