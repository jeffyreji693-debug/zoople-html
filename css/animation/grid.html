<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .grid{
            display: grid;
            grid-template-columns: 200px 100px ;
        }
    
        
    </style>
</head>
<body>
    <div class="grid">
        <div style="background-color: beige;">1</div>
        <div style="background-color: aquamarine;">2</div>
        <div style="background-color: brown;">3</div>
        <div style="background-color: blue;">4</div>
        <div style="background-color: aquamarine;">5</div>
        <div style="background-color: blanchedalmond;">6</div>
    </div>
</body>
</html>
