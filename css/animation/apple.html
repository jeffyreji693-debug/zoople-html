<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <style>

        .drop{
            animation: moveing 1s ease-in 4;
            position: relative;
        }

        @keyframes moveing{
         
            0%{
                transform: translatey(0%);
            }
            100%{
                transform: translatey(100vh);
            }
        }
        
    img{
        width: 20%;
    }
    </style>


</head>
<body>
    <div class="drop">
        <img src="apple-removebg-preview.png" alt="">
    </div>
</body>
</html>
